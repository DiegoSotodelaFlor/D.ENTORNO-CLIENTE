    <h1>Cambio de imagenes con JavaScript</h1>

    <img id="myFImage"
         onclick="cambiaPic()"
         src="http://myfpschool.com/wp-content/uploads/2016/06/myblack.jpeg"
         width="100"
         height="180">

    <p>Haz click sobre las letras para cambiarlas.</p>

    <script>
        function cambiaPic() {
            var image = document.getElementById('myFImage');

            if (image.src.match("green")) {
                image.src = "http://myfpschool.com/wp-content/uploads/2016/06/myblack.jpeg";
            } else {
                image.src = "http://myfpschool.com/wp-content/uploads/2016/06/mygreen.jpeg";
            }
        }
    </script>

    <p id="mytxt">Aprende JS con .....</p>
    <button type="button" ondblclick="myFunction()">Dale!</button>
    <script>
        function myFunction(){
            var x=document.getElementById("mytxt");
            x.style.fontSize="25px";
            x.style.color="red"
        }
    </script>
