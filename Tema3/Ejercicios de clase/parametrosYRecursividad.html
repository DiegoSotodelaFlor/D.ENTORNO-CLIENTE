<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones JavaScript</title>
</head>

<body>
    <script>
        function saludar(nombre = "invitado") {
            return "Hola, " + nombre;
        }
        console.log(saludar());
        console.log(saludar("Ana"));
        function cuentaAtras(n) {
            if (n < 0) return; // caso base
            console.log(n);
            cuentaAtras(n - 1);
        }
        cuentaAtras(3);

    </script>

</body>

</html>
