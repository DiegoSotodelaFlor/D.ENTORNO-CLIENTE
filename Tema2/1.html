<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        var radio = 5;
        var longitud = radio * Math.PI;
        var area = Math.PI * radio ^ 2;

        console.log("Un circulo de radio " + radio + " , tiene una longitud de " + longitud + " y su area es de " + area);
    </script>
</body>
</html>
