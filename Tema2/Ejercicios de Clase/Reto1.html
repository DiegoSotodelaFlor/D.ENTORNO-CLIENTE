<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tema 2 - Eventos con 'on...'</title>
    <style>

    </style>
</head>

<body>
    <h1>Boletín de notas de clase</h1>

    <a href="">Notas</a> | <a href="">Consultas</a>

    <div>
        <table border="1" id="tabla">
            <tr style="background-color: azure;">
                <th>Alumno</th>
                <th>1T</th>
                <th>2T</th>
                <th>3T</th>
                <th>Media</th>
                <th>Calificación</th>
            </tr>
        </table>
    </div>

    <div id="añadir">
        <h2>Añadir alumno</h2>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="1T">1T:</label>
        <input type="number" id="1T" name="1T">

        <label for="2T">2T:</label>
        <input type="number" id="2T" name="2T">

        <label for="3T">3T:</label>
        <input type="number" id="3T" name="3T">

        <button id="botonAñadir" onclick="añadirAlumno()" style="background-color: blue; color: white;">Añadir</button>

        <br><br>

        <button id="botonVolver" onclick="volver()" style="background-color: grey; color: white;">Volver a los valores
            iniciales</button>

        <br><br>

        <p id="añadido"></p>
    </div>

    <div id="seccionConsultas">
        <h2>Consultas</h2>

        <button onclick="contarAprobados()">Contar aprobados</button>
        <button onclick="mejorNota()">Mejor nota de la clase</button>
        <button onclick="mediaTrimestre()">Media de un trimestre</button>
        <select id="trimestre">
            <option value="1">1º trimestre</option>
            <option value="2">2º trimestre</option>
            <option value="3">3º trimestre</option>
        </select>

        <br><br>

        <input type="text" id="buscarNombre" placeholder="Nombre del alumno">
        <button onclick="buscarAlumno()">Buscar alumno</button>

        <h3>Resultado</h3>
        <div id="resultado"></div>
    </div>

    <script>
        var contador = 1;

        function añadirAlumno() {
            var nombre = document.getElementById("nombre").value;
            var nota1 = Number(document.getElementById("1T").value);
            var nota2 = Number(document.getElementById("2T").value);
            var nota3 = Number(document.getElementById("3T").value);


            var media = (nota1 + nota2 + nota3) / 3;
            var calificacion;

            if (media < 5) {
                calificacion = "Insuficiente";
            } else if (media < 6) {
                calificacion = "Suficiente";
            } else if (media < 7) {
                calificacion = "Bien";
            } else if (media < 9) {
                calificacion = "Notable";
            } else {
                calificacion = "Sobresaliente";
            }

            var tabla = document.getElementById("tabla");
            var fila = tabla.insertRow();

            fila.insertCell(0).innerHTML = nombre;
            fila.insertCell(1).innerHTML = nota1;
            fila.insertCell(2).innerHTML = nota2;
            fila.insertCell(3).innerHTML = nota3;
            fila.insertCell(4).innerHTML = media.toFixed(2);
            fila.insertCell(5).innerHTML = calificacion;

            if (nota1 > 4) {
                fila.cells[1].style.backgroundColor = "green";
            } else if (nota1 < 5) {
                fila.cells[1].style.backgroundColor = "red";
            }

            if (nota2 > 4) {
                fila.cells[2].style.backgroundColor = "green";
            } else if (nota2 < 5) {
                fila.cells[2].style.backgroundColor = "red";
            }

            if (nota3 > 4) {
                fila.cells[3].style.backgroundColor = "green";
            } else if (nota3 < 5) {
                fila.cells[3].style.backgroundColor = "red";
            }

            contador++;

            document.getElementById("añadido").innerHTML = "Añadido: " + nombre + ". Ahora hay  " + contador + " alumnos.";

            document.getElementById("nombre").value = "";
            document.getElementById("1T").value = "";
            document.getElementById("2T").value = "";
            document.getElementById("3T").value = "";
        }

        function volver() {
            location.reload();
        }

        function contarAprobados() {
            var filas = document.getElementById("tabla").rows;
            var aprobados = 0;
            for (var i = 1; i < filas.length; i++) {
                var media = Number(filas[i].cells[4].innerHTML);
                if (media >= 5) {
                    aprobados++;
                }
            }
            var total = filas.length - 1;
            document.getElementById("resultado").innerHTML =
                "Aprobados: " + aprobados + " de " + total + " alumnos<br>" +
                "Suspensos: " + (total - aprobados);
        }

        function mejorNota() {
            var filas = document.getElementById("tabla").rows;

            if (filas.length < 2) {
                document.getElementById("resultado").innerHTML = "No hay alumnos en la tabla.";
                return;
            }

            var mejorFila = filas[1];
            for (var i = 2; i < filas.length; i++) {
                if (Number(filas[i].cells[4].innerHTML) > Number(mejorFila.cells[4].innerHTML)) {
                    mejorFila = filas[i];
                }
            }

            document.getElementById("resultado").innerHTML =
                "Mejor nota de la clase: " + mejorFila.cells[0].innerHTML + "<br>" +
                "Notas: " + mejorFila.cells[1].innerHTML + ", " + mejorFila.cells[2].innerHTML + ", " + mejorFila.cells[3].innerHTML + "<br>" +
                "Media: " + mejorFila.cells[4].innerHTML + " (" + mejorFila.cells[5].innerHTML + ")";
        }

        function mediaTrimestre() {
            var filas = document.getElementById("tabla").rows;
            var trimestre = Number(document.getElementById("trimestre").value);

            if (filas.length < 2) {
                document.getElementById("resultado").innerHTML = "No hay alumnos en la tabla.";
                return;
            }

            var suma = 0;
            for (var i = 1; i < filas.length; i++) {
                suma += Number(filas[i].cells[trimestre].innerHTML);
            }
            var media = suma / (filas.length - 1);

            document.getElementById("resultado").innerHTML =
                "Media del " + trimestre + "º trimestre: " + media.toFixed(2);
        }

        function buscarAlumno() {
            var texto = document.getElementById("buscarNombre").value.trim().toLowerCase();
            var filas = document.getElementById("tabla").rows;

            if (texto == "") {
                document.getElementById("resultado").innerHTML = "Escribe el nombre de un alumno.";
                return;  
            }

            for (var i = 1; i < filas.length; i++) {
                if (filas[i].cells[0].innerHTML.toLowerCase() == texto) {
                    document.getElementById("resultado").innerHTML =
                        filas[i].cells[0].innerHTML + " está en la posición " + i + "<br>" +
                        "Notas: " + filas[i].cells[1].innerHTML + ", " + filas[i].cells[2].innerHTML + ", " + filas[i].cells[3].innerHTML + "<br>" +
                        "Media: " + filas[i].cells[4].innerHTML + " (" + filas[i].cells[5].innerHTML + ")";
                    return;
                }
            }

            document.getElementById("resultado").innerHTML = "No se ha encontrado ningún alumno con ese nombre.";
        }
    </script>

</body>

</html>
