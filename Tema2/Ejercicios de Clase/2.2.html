<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        class Persona {
            constructor(nombre, edad, altura) {
                this.nombre=nombre;
                this.edad=edad;
                this.altura=altura;
            }
        }
        var persona = new Persona("Dimas", 28, 185);
        console.log("El usuario "+persona.nombre+ " tiene "+persona.edad+" años y mide "+persona.altura+ "centímetros");
    </script>
</body>
</html>
