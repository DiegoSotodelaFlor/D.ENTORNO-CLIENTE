<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <script>
        /*El operador ternario en JavaScript permite hacer una condición de forma abreviada. Es una alternativa sencilla a if...else cuando solo necesitamos elegir entre dos opciones.
        Sintaxis:
        condicion ? valorSiVerdadero : valorSiFalso;*/
        var edad = 20;
        var resultado = edad >= 18 ? "Es mayor de edad" : "Es menor de edad";
        console.log(resultado);
    </script>
</body>

</html>
