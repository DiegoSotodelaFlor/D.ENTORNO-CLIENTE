    <h1>Cambio de imagenes con JavaScript</h1>

    <img id="myFImage"
         onclick="cambiaPic()"
         src="https://www.ifema.es/img/xl/golden-retriever-perros-inteligentes/golden-retriever-entre-perros-mas-inteligentes.jpeg"
         width="100"
         height="180">

    <p>Haz click sobre las letras para cambiarlas.</p>

    <script>
        function cambiaPic() {
            var image = document.getElementById('myFImage');

            if (image.src.match("https://www.ifema.es/img/xl/golden-retriever-perros-inteligentes/golden-retriever-entre-perros-mas-inteligentes.jpeg")) {
                image.src = "https://pampermut.com/blog/wp-content/uploads/2025/02/perro-border-collie-horoscopo.webp";
            } else {
                image.src = "https://www.ifema.es/img/xl/golden-retriever-perros-inteligentes/golden-retriever-entre-perros-mas-inteligentes.jpeg";
            }
        }
    </script>

    <p id="mytxt">Aprende JS con .....</p>
    <button type="button" ondblclick="myFunction()">Dale!</button>
    <script>
        function myFunction(){
            var x=document.getElementById("mytxt");
            x.style.fontSize="25px";
            x.style.color="red"
        }
    </script>
